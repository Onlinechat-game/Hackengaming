<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HACKEN CONNECT - ULTIMATE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs (Version Compatible) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #6366f1; --secondary: #ec4899; --accent: #8b5cf6;
            --dark: #0f172a; --card: #1e293b; --input: #334155; --success: #10b981;
        }
        body { font-family: 'Poppins', sans-serif; background-color: var(--dark); color: white; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .card { background: rgba(30, 41, 59, 0.5); padding: 15px; border-radius: 15px; margin-bottom: 10px; cursor: pointer; transition: transform 0.2s; border: 1px solid rgba(255,255,255,0.05); }
        .card:hover { transform: translateY(-2px); background: rgba(30, 41, 59, 0.8); }
        
        /* Chat Styles */
        .chat-list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: rgba(30, 41, 59, 0.4); border-radius: 12px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
        .chat-list-item:hover { background: rgba(30, 41, 59, 0.7); }
        .chat-info { display: flex; align-items: center; gap: 12px; flex: 1; overflow: hidden; }
        .chat-preview { font-size: 13px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
        .notification-badge { background: #ef4444; color: white; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; min-width: 18px; text-align: center; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        
        .chat-interface { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--dark); display: flex; flex-direction: column; }
        .chat-header { padding: 15px; background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message-bubble { max-width: 75%; padding: 10px 15px; border-radius: 15px; font-size: 14px; animation: slideIn 0.3s ease; }
        .msg-me { align-self: flex-end; background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; border-bottom-right-radius: 2px; }
        .msg-other { align-self: flex-start; background: rgba(255,255,255,0.1); color: white; border-bottom-left-radius: 2px; }
        .chat-input-area { padding: 10px; background: rgba(30, 41, 59, 0.9); border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; padding: 12px; z-index: 40; }
        .nav-item { color: #64748b; text-align: center; font-size: 10px; cursor: pointer; position: relative; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; display: block; }
        .hidden { display: none !important; }
        
        /* Game Styles Simplified */
        .tictactoe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 280px; margin: 0 auto; }
        .ttt-cell { aspect-ratio: 1; background: var(--input); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; cursor: pointer; }
        .math-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 300px; margin: 0 auto; }
        .math-key { padding: 15px; border-radius: 12px; border: none; background: var(--input); color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="hidden" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
        <h2 class="text-2xl font-bold mb-6">Connexion à Hacken Connect</h2>
        <input type="tel" id="phone-input" placeholder="Entrez votre numéro" class="w-full max-w-xs p-3 rounded-lg bg-slate-700 text-white outline-none mb-4">
        <button onclick="handleLogin()" class="bg-indigo-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-indigo-700 transition">Se connecter</button>
    </div>

    <!-- APP CONTAINER -->
    <div id="app-container" class="hidden pb-20">
        <!-- Header -->
        <div class="glass sticky top-0 z-30 p-4 flex items-center gap-4">
            <img id="header-avatar" src="" class="avatar">
            <div>
                <h1 id="header-name" class="text-lg font-bold m-0">Nom</h1>
                <p class="text-xs text-green-500 m-0">● En ligne</p>
            </div>
        </div>

        <!-- VIEW: CHAT LIST -->
        <div id="view-chatlist" class="view active p-4">
            <h2 class="text-2xl font-bold mb-5">Conversations</h2>
            <input type="text" id="search-chat" onkeyup="filterChatList()" placeholder="Rechercher un ami..." class="w-full p-3 mb-5 rounded-xl bg-slate-700 text-white outline-none">
            <div id="chat-list-container">
                <div class="text-center text-slate-500 p-5">Chargement...</div>
            </div>
        </div>

        <!-- VIEW: HOME (Placeholder) -->
        <div id="view-home" class="view hidden p-4 text-center">
            <h2 class="text-2xl font-bold">Accueil</h2>
            <p class="text-slate-400 mt-4">Bienvenue sur Hacken Connect!</p>
            <button onclick="switchView('view-chatlist')" class="mt-6 bg-indigo-600 text-white py-2 px-6 rounded-lg">Aller aux Messages</button>
        </div>

        <!-- VIEW: GAMES (Placeholder for logic) -->
        <div id="view-games" class="view hidden p-4">
            <h2 class="text-2xl font-bold mb-4">Jeux</h2>
            <div class="grid grid-cols-2 gap-4">
                <div onclick="alert('Morpion bientôt!')" class="card p-6 text-center bg-slate-800">
                    <div class="text-4xl mb-2">⭕</div>
                    <div class="font-bold">Morpion</div>
                </div>
                <div onclick="alert('Math Battle bientôt!')" class="card p-6 text-center bg-slate-800">
                    <div class="text-4xl mb-2">🧮</div>
                    <div class="font-bold">Maths</div>
                </div>
            </div>
        </div>
    </div>

    <!-- CHAT INTERFACE OVERLAY -->
    <div id="chat-interface" class="chat-interface hidden">
        <div class="chat-header">
            <button onclick="closeChat()" class="bg-transparent border-none text-white text-2xl cursor-pointer">←</button>
            <img id="chat-header-img" src="" class="avatar w-9 h-9">
            <div class="flex-1">
                <h3 id="chat-header-name" class="text-base font-bold m-0">Nom</h3>
                <p id="chat-status" class="text-xs text-green-500 m-0">En ligne</p>
            </div>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Message..." class="flex-1 p-3 bg-slate-700 border-none rounded-full text-white outline-none">
            <button onclick="sendMessage()" class="w-11 h-11 rounded-full bg-indigo-600 border-none text-white text-xl cursor-pointer">➤</button>
        </div>
    </div>

    <!-- NAVIGATION BAR -->
    <div class="nav-bar">
        <div class="nav-item" onclick="switchView('view-home')">
            <span class="nav-icon">🏠</span>Accueil
        </div>
        <div class="nav-item active" onclick="switchView('view-chatlist')">
            <span class="nav-icon">💬</span>Messages
            <span id="nav-badge" class="hidden absolute top-1 right-6 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full">0</span>
        </div>
        <div class="nav-item" onclick="switchView('view-games')">
            <span class="nav-icon">🎮</span>Jeux
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyCtHXCyNu4psPE-O0KwcGtbbc05wTGzv3A",
            authDomain: "hacken-a39e0.firebaseapp.com",
            databaseURL: "https://hacken-a39e0-default-rtdb.firebaseio.com",
            projectId: "hacken-a39e0",
            storageBucket: "hacken-a39e0.firebasestorage.app",
            messagingSenderId: "443590830785",
            appId: "1:443590830785:web:fe1d1d9be93ccf98220240"
        };

        let db, app;
        if (!firebase.apps.length) {
            app = firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } else {
            app = firebase.app();
            db = firebase.database();
        }

        // --- STATE ---
        let currentUser = null;
        let activeChatId = null;
        let chatListener = null;
        let unreadCounts = {}; 

        // --- AUTH ---
        function handleLogin() {
            const phone = document.getElementById('phone-input').value;
            if(!phone) return alert("Entrez un numéro");
            
            // Simulation User (Remplace par ta logique réelle si besoin)
            currentUser = {
                id: 'user_' + phone.replace(/\D/g,''),
                name: 'Utilisateur ' + phone.slice(-4),
                avatar: `https://ui-avatars.com/api/?name=User&background=6366f1&color=fff`,
                friends: [
                    { id: 'friend_1', name: 'Thomas', avatar: 'https://ui-avatars.com/api/?name=Thomas&background=ec4899&color=fff' },
                    { id: 'friend_2', name: 'Sarah', avatar: 'https://ui-avatars.com/api/?name=Sarah&background=10b981&color=fff' },
                    { id: 'friend_3', name: 'Julien', avatar: 'https://ui-avatars.com/api/?name=Julien&background=f59e0b&color=fff' }
                ]
            };
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('header-name').innerText = currentUser.name;
            document.getElementById('header-avatar').src = currentUser.avatar;
            
            initChatSystem();
        }

        // --- CHAT LOGIC ---
        function initChatSystem() {
            renderChatList();
            listenForGlobalMessages();
        }

        function renderChatList() {
            const container = document.getElementById('chat-list-container');
            if (!currentUser || !currentUser.friends) return;
            container.innerHTML = '';
            
            if (currentUser.friends.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-500 p-5">Aucune conversation.</div>';
                updateNavBadge();
                return;
            }

            currentUser.friends.forEach(friend => {
                const count = unreadCounts[friend.id] || 0;
                const item = document.createElement('div');
                item.className = 'chat-list-item';
                item.onclick = () => openChat(friend.id, friend.name, friend.avatar);

                let badgeHtml = count > 0 ? `<span class="notification-badge">${count > 9 ? '9+' : count}</span>` : '';

                item.innerHTML = `
                    <div class="chat-info">
                        <img src="${friend.avatar}" class="avatar w-12 h-12">
                        <div class="overflow-hidden">
                            <h3 class="m-0 text-base font-semibold truncate">${friend.name}</h3>
                            <p class="m-0 text-sm text-slate-400 truncate">${count > 0 ? 'Nouveau message...' : 'Appuyez pour discuter'}</p>
                        </div>
                    </div>
                    ${badgeHtml}
                `;
                container.appendChild(item);
            });
            updateNavBadge();
        }

        function updateNavBadge() {
            const totalUnread = Object.values(unreadCounts).reduce((a, b) => a + b, 0);
            const badge = document.getElementById('nav-badge');
            if (totalUnread > 0) {
                badge.innerText = totalUnread > 9 ? '9+' : totalUnread;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function openChat(friendId, friendName, friendAvatar) {
            activeChatId = friendId;
            unreadCounts[friendId] = 0;
            renderChatList();
            
            document.getElementById('chat-interface').classList.remove('hidden');
            document.getElementById('chat-header-name').innerText = friendName;
            document.getElementById('chat-header-img').src = friendAvatar;
            loadMessages(friendId);
        }

        function closeChat() {
            document.getElementById('chat-interface').classList.add('hidden');
            activeChatId = null;
        }

        function loadMessages(friendId) {
            const chatKey = getChatKey(currentUser.id, friendId);
            const container = document.getElementById('chat-messages');
            container.innerHTML = '<div class="text-center text-slate-500 text-xs mt-4">Chargement...</div>';

            if(chatListener) chatListener.off();

            chatListener = db.ref('chats/' + chatKey).on('value', (snapshot) => {
                container.innerHTML = '';
                const data = snapshot.val();
                if(!data) {
                    container.innerHTML = '<div class="text-center text-slate-500 mt-10">Aucun message. Dites bonjour ! 👋</div>';
                    return;
                }
                Object.values(data).forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `message-bubble ${msg.sender === currentUser.id ? 'msg-me' : 'msg-other'}`;
                    div.innerText = msg.text;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text || !activeChatId) return;
            const chatKey = getChatKey(currentUser.id, activeChatId);
            db.ref('chats/' + chatKey).push({ sender: currentUser.id, text: text, timestamp: Date.now() });
            input.value = '';
        }

        function getChatKey(id1, id2) { return [id1, id2].sort().join('_'); }

        function filterChatList() {
            const query = document.getElementById('search-chat').value.toLowerCase();
            document.querySelectorAll('#chat-list-container .chat-list-item').forEach(item => {
                const name = item.querySelector('h3').innerText.toLowerCase();
                item.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }

        function listenForGlobalMessages() {
            if (!currentUser || !currentUser.friends) return;
            currentUser.friends.forEach(friend => {
                const chatKey = getChatKey(currentUser.id, friend.id);
                db.ref('chats/' + chatKey).limitToLast(1).on('child_added', (snapshot) => {
                    const data = snapshot.val();
                    if (data.sender !== currentUser.id && activeChatId !== friend.id) {
                        unreadCounts[friend.id] = (unreadCounts[friend.id] || 0) + 1;
                        renderChatList();
                    }
                });
            });
        }

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(viewId === 'view-chatlist') document.querySelectorAll('.nav-item')[1].classList.add('active');
            if(viewId === 'view-home') document.querySelectorAll('.nav-item')[0].classList.add('active');
            if(viewId === 'view-games') document.querySelectorAll('.nav-item')[2].classList.add('active');
        }

        // Init
        document.getElementById('login-screen').style.display = 'flex';
    </script>
</body>
</html>
